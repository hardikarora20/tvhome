plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId "com.gathin.tvhome"
        minSdk 23
        targetSdk 34
        versionCode 41
        versionName "4.1-glass"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Media3 marks some APIs "unstable" via a lint check; don't let that fail the build.
    lint {
        disable 'UnsafeOptInUsageError'
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Background stream player (HLS .m3u8). 1.4.1 is the last line that builds with compileSdk 34.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    // Provides @OptIn (Media3 only uses it internally, so the app must add it itself).
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
    // Aligns Kotlin stdlib versions pulled in by AndroidX -> avoids "Duplicate class kotlin.*" errors.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
